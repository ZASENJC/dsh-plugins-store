server {
    listen 80;
    listen [::]:80;
    server_name dshmk.com api.dshmk.com;

    root /opt/dsh-plugins-store/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /catalog.json {
        try_files $uri =404;
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri.html $uri/index.html $uri =404;
    }
}
