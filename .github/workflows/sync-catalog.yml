name: Sync catalog

on:
  schedule:
    - cron: '25,55 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync GitHub Topic
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DSH_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DSH_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/dsh-store-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dsh-store-deploy ~/.ssh/known_hosts

      - name: Publish to dsh.aitreez.com
        env:
          DEPLOY_HOST: ${{ secrets.DSH_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DSH_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DSH_DEPLOY_USER }}
        run: |
          deploy_sha="$(git rev-parse HEAD)"
          tar -C dist -czf - . | ssh \
            -i ~/.ssh/dsh-store-deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $deploy_sha"
