name: Sync catalog

on:
  workflow_run:
    workflows: [Validate plugins]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VALIDATION_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      VALIDATION_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore last successful validation feed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          restored=false
          if test -n "$VALIDATION_RUN_ID"; then
            run_ids="$VALIDATION_RUN_ID"
          else
            run_ids="$(gh run list --workflow validate-plugins.yml --branch "$VALIDATION_BRANCH" --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          fi
          for run_id in $run_ids; do
            run_metadata="$(gh run view "$run_id" --json workflowName,headBranch,status,conclusion 2>/dev/null || true)"
            if [[ -z "$run_metadata" ]] || ! printf '%s' "$run_metadata" | EXPECTED_BRANCH="$VALIDATION_BRANCH" node -e '
              const fs = require("node:fs")
              const metadata = JSON.parse(fs.readFileSync(0, "utf8"))
              process.exit(metadata.workflowName === "Validate plugins"
                && metadata.headBranch === process.env.EXPECTED_BRANCH
                && metadata.status === "completed"
                && metadata.conclusion === "success" ? 0 : 1)
            '; then
              continue
            fi
            artifact_dir="validation-restore/$run_id"
            if gh run download "$run_id" --name plugin-validation-state --dir "$artifact_dir" 2>/dev/null \
              && test -f "$artifact_dir/validation.json" \
              && test -f "$artifact_dir/state.json" \
              && npm run validate:artifact -- "$artifact_dir"; then
              cp "$artifact_dir/validation.json" src/data/validation.json
              restored=true
              break
            fi
          done
          if test "$restored" = false; then
            echo "No prior validation artifact is available; catalog refresh will use the checked-in feed."
          fi

      - name: Restore latest completed source classification archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          restored=false
          for workflow_name in validate-plugins.yml classify-plugins.yml; do
            if test "$workflow_name" = "validate-plugins.yml"; then
              if test -n "$VALIDATION_RUN_ID"; then run_ids="$VALIDATION_RUN_ID"; else run_ids="$(gh run list --workflow validate-plugins.yml --branch "$VALIDATION_BRANCH" --limit 30 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"; fi
              artifact_name=plugin-validation-state
            else
              run_ids="$(gh run list --workflow classify-plugins.yml --branch "$VALIDATION_BRANCH" --limit 30 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
              artifact_name=plugin-classification-state
            fi
            for run_id in $run_ids; do
              run_metadata="$(gh run view "$run_id" --json workflowName,headBranch,status,conclusion 2>/dev/null || true)"
              if [[ -z "$run_metadata" ]] || ! printf '%s' "$run_metadata" | EXPECTED_BRANCH="$VALIDATION_BRANCH" node -e '
                const fs = require("node:fs")
                const metadata = JSON.parse(fs.readFileSync(0, "utf8"))
                process.exit(metadata.headBranch === process.env.EXPECTED_BRANCH
                  && metadata.status === "completed"
                  && ["success", "failure", "cancelled", "timed_out"].includes(metadata.conclusion) ? 0 : 1)
              '; then
                continue
              fi
              artifact_dir="classification-restore/$run_id"
              if gh run download "$run_id" --name "$artifact_name" --dir "$artifact_dir" 2>/dev/null \
                && test -f "$artifact_dir/source-classification.json" \
                && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$artifact_dir/source-classification.json"; then
                cp "$artifact_dir/source-classification.json" src/data/source-classification.json
                restored=true
                break 2
              fi
            done
          done
          if test "$restored" = false; then
            echo "No completed source classification archive is available; catalog refresh will use topic classification."
          fi

      - name: Sync GitHub Topic
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASSIFICATION_ARCHIVE_PATH: ${{ github.workspace }}/src/data/source-classification.json
          DISCOVERY_OUTPUT_PATH: ${{ github.workspace }}/validation/discovery.json

      - name: Upload immutable catalog snapshot
        uses: actions/upload-artifact@v4
        with:
          name: plugin-catalog-snapshot
          path: src/data/catalog.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable discovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: plugin-discovery-snapshot
          path: validation/discovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DSH_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DSH_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/dsh-store-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dsh-store-deploy ~/.ssh/known_hosts

      - name: Publish to dsh.aitreez.com
        env:
          DEPLOY_HOST: ${{ secrets.DSH_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DSH_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DSH_DEPLOY_USER }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          deploy_sha="$(printf '%s' "$SOURCE_COMMIT:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-40)"
          tar -C dist -czf - . | ssh \
            -i ~/.ssh/dsh-store-deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $deploy_sha"
