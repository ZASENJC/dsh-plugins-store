name: Sync catalog

on:
  workflow_run:
    workflows: [Validate plugins]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != ''
    runs-on: ubuntu-latest
    env:
      VALIDATION_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      VALIDATION_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      SOURCE_CLASSIFIER_VERSION: '0.2.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore latest catalog snapshot for Star history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          restore_root="$(mktemp -d)"
          latest_catalog="$restore_root/latest/catalog.json"
          pre_midnight_catalog="$restore_root/pre-midnight/catalog.json"
          restored=false
          current_day_start="$(node -e 'const now=Date.now(); const day=86400000; const offset=8*3600000; console.log(new Date(Math.floor((now + offset) / day) * day - offset).toISOString())')"
          previous_day_start="$(node -e 'console.log(new Date(Date.parse(process.argv[1]) - 86400000).toISOString())' "$current_day_start")"
          run_records="$(gh run list --workflow sync-catalog.yml --branch "$VALIDATION_BRANCH" --status success --limit 80 --json databaseId,createdAt --jq '.[] | [.databaseId,.createdAt] | @tsv' 2>/dev/null || true)"
          latest_run_id="$(printf '%s\n' "$run_records" | head -n 1 | cut -f1)"
          download_catalog() {
            local run_id="$1"
            local artifact_dir="$2"
            rm -rf "$artifact_dir"
            gh run download "$run_id" --name plugin-catalog-snapshot --dir "$artifact_dir" 2>/dev/null \
              && test -f "$artifact_dir/catalog.json" \
              && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$artifact_dir/catalog.json"
          }
          if test -n "$latest_run_id" \
            && download_catalog "$latest_run_id" "$restore_root/latest"; then
            restored=true
          fi
          baseline_run_ids="$(printf '%s\n' "$run_records" \
            | awk -F '\t' -v start="$current_day_start" -v previous="$previous_day_start" '$2 < start && $2 >= previous {print $1}' \
            | head -n 6)"
          for run_id in $baseline_run_ids; do
            if download_catalog "$run_id" "$restore_root/pre-midnight-$run_id" \
              && CANDIDATE_CATALOG="$restore_root/pre-midnight-$run_id/catalog.json" \
                DAY_START="$current_day_start" \
                node -e '
                  const fs = require("node:fs")
                  const candidate = JSON.parse(fs.readFileSync(process.env.CANDIDATE_CATALOG, "utf8"))
                  const generatedAt = Date.parse(candidate.generatedAt)
                  const dayStart = Date.parse(process.env.DAY_START)
                  process.exit(Number.isFinite(generatedAt) && generatedAt < dayStart ? 0 : 1)
                '; then
              mkdir -p "$restore_root/pre-midnight"
              cp "$restore_root/pre-midnight-$run_id/catalog.json" "$pre_midnight_catalog"
              break
            fi
          done
          if test "$restored" = true; then
            if test -f "$pre_midnight_catalog"; then
              LATEST_CATALOG="$latest_catalog" \
              PRE_MIDNIGHT_CATALOG="$pre_midnight_catalog" \
              DAY_START="$current_day_start" \
              node <<'NODE'
              const fs = require('node:fs')

              const latestPath = process.env.LATEST_CATALOG
              const preMidnightPath = process.env.PRE_MIDNIGHT_CATALOG
              const dayStart = Date.parse(process.env.DAY_START)
              const latest = JSON.parse(fs.readFileSync(latestPath, 'utf8'))
              const preMidnight = JSON.parse(fs.readFileSync(preMidnightPath, 'utf8'))
              const previousById = new Map((preMidnight.repositories ?? []).map((entry) => [entry.repositoryId, entry]))
              let merged = 0

              for (const entry of latest.repositories ?? []) {
                const points = entry.starTrend?.points
                if (!Array.isArray(points) || points.some((point) => Date.parse(point.capturedAt) === dayStart)) continue
                const previous = previousById.get(entry.repositoryId)
                const baseline = (previous?.starTrend?.points ?? [])
                  .filter((point) => {
                    const capturedAt = Date.parse(point.capturedAt)
                    return Number.isFinite(capturedAt) && capturedAt >= dayStart - 86400000 && capturedAt < dayStart
                  })
                  .sort((left, right) => Date.parse(left.capturedAt) - Date.parse(right.capturedAt))
                  .at(-1)
                if (!baseline) continue
                entry.starTrend.points = [baseline, ...points.filter((point) => point.capturedAt !== baseline.capturedAt)]
                merged += 1
              }

              fs.writeFileSync(latestPath, `${JSON.stringify(latest, null, 2)}\n`)
              console.log(`Restored ${merged} Star-history baselines from the last pre-midnight catalog snapshot.`)
          NODE
            fi
            cp "$latest_catalog" src/data/catalog.json
          fi
          rm -rf "$restore_root"
          if test "$restored" = false; then
            echo "Star history will restart from the checked-in catalog; catalog publication will continue."
          fi

      - name: Restore source classification archive from upstream workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test ! -f src/data/source-classification.json; then
            persisted_archive="$(mktemp)"
            if git fetch --no-tags origin "$VALIDATION_BRANCH" >/dev/null 2>&1 \
              && git show "origin/$VALIDATION_BRANCH:src/data/source-classification.json" > "$persisted_archive" 2>/dev/null; then
              mv "$persisted_archive" src/data/source-classification.json
            else
              rm -f "$persisted_archive"
            fi
          fi
          download_artifact_with_retry() {
            local run_id="$1"
            local artifact_name="$2"
            local artifact_dir="$3"
            rm -rf "$artifact_dir"
            for attempt in 1 2 3 4 5 6 7 8; do
              if gh run download "$run_id" --name "$artifact_name" --dir "$artifact_dir" 2>/dev/null; then
                return 0
              fi
              rm -rf "$artifact_dir"
              if test "$attempt" -lt 8; then
                echo "Retry archive download ($artifact_name, attempt $attempt/8)"
                sleep 10
              fi
            done
            return 1
          }
          archive_is_newer_or_equal() {
            local candidate="$1"
            if test ! -f src/data/source-classification.json; then return 0; fi
            CURRENT_ARCHIVE=src/data/source-classification.json CANDIDATE_ARCHIVE="$candidate" node -e '
              const fs = require("node:fs")
              try {
                const current = JSON.parse(fs.readFileSync(process.env.CURRENT_ARCHIVE, "utf8"))
                const candidate = JSON.parse(fs.readFileSync(process.env.CANDIDATE_ARCHIVE, "utf8"))
                const currentTime = Date.parse(current.generatedAt)
                const candidateTime = Date.parse(candidate.generatedAt)
                process.exit(Number.isFinite(currentTime) && Number.isFinite(candidateTime)
                  && candidateTime < currentTime ? 1 : 0)
              } catch {
                process.exit(0)
              }
            '
          }
          restored=false
          for workflow_name in validate-plugins.yml classify-plugins.yml; do
            if test "$workflow_name" = "validate-plugins.yml"; then
              if test -n "$VALIDATION_RUN_ID"; then
                run_ids="$VALIDATION_RUN_ID $(gh run list --workflow validate-plugins.yml --branch "$VALIDATION_BRANCH" --limit 30 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
              else
                run_ids="$(gh run list --workflow validate-plugins.yml --branch "$VALIDATION_BRANCH" --limit 30 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
              fi
              artifact_name=plugin-validation-state
            else
              run_ids="$(gh run list --workflow classify-plugins.yml --branch "$VALIDATION_BRANCH" --limit 30 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
              artifact_name=plugin-classification-state
            fi
            for run_id in $run_ids; do
              run_metadata="$(gh run view "$run_id" --json workflowName,headBranch,status,conclusion 2>/dev/null || true)"
              if [[ -z "$run_metadata" ]] || ! printf '%s' "$run_metadata" | EXPECTED_WORKFLOW="$workflow_name" EXPECTED_BRANCH="$VALIDATION_BRANCH" node -e '
                const fs = require("node:fs")
                const metadata = JSON.parse(fs.readFileSync(0, "utf8"))
                process.exit(metadata.workflowName === (process.env.EXPECTED_WORKFLOW === "validate-plugins.yml" ? "Validate plugins" : "Classify plugins")
                  && metadata.headBranch === process.env.EXPECTED_BRANCH
                  && metadata.status === "completed"
                  && metadata.conclusion === "success" ? 0 : 1)
              '; then
                continue
              fi
              artifact_dir="classification-restore/$run_id"
              if download_artifact_with_retry "$run_id" "$artifact_name" "$artifact_dir" \
                && test -f "$artifact_dir/source-classification.json" \
                && node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$artifact_dir/source-classification.json" \
                && archive_is_newer_or_equal "$artifact_dir/source-classification.json"; then
                cp "$artifact_dir/source-classification.json" src/data/source-classification.json
                restored=true
                break 2
              fi
            done
          done
          if test "$restored" = false; then
            if test -f src/data/source-classification.json; then
              echo "No newer source classification archive is available; sync will use the persisted archive."
            else
              echo "No completed source classification archive is available; sync will fail closed for public admission."
            fi
          fi

      - name: Persist source classification archive
        env:
          BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          if test ! -f src/data/source-classification.json; then
            echo "No source classification archive to persist."
            exit 0
          fi
          set -euo pipefail
          archive_snapshot="$(mktemp)"
          persist_parent="$(mktemp -d)"
          persist_root="$persist_parent/checkout"
          cp src/data/source-classification.json "$archive_snapshot"
          cleanup_persist_worktree() {
            git worktree remove --force "$persist_root" >/dev/null 2>&1 || true
            rm -f "$archive_snapshot"
            rmdir "$persist_parent" >/dev/null 2>&1 || true
          }
          trap cleanup_persist_worktree EXIT
          git fetch --no-tags origin "$BRANCH"
          git worktree add --detach "$persist_root" "origin/$BRANCH"
          cp "$archive_snapshot" "$persist_root/src/data/source-classification.json"
          git -C "$persist_root" add src/data/source-classification.json
          if git -C "$persist_root" diff --cached --quiet; then
            echo "Persisted source classification archive is unchanged."
            exit 0
          fi
          git -C "$persist_root" config user.name 'github-actions[bot]'
          git -C "$persist_root" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$persist_root" commit -m 'chore: persist source classification archive'
          git -C "$persist_root" push origin "HEAD:$BRANCH"

      - name: Sync GitHub Topic
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASSIFICATION_ARCHIVE_PATH: ${{ github.workspace }}/src/data/source-classification.json
          DISCOVERY_OUTPUT_PATH: ${{ github.workspace }}/validation/discovery.json

      - name: Upload immutable catalog snapshot
        uses: actions/upload-artifact@v6
        with:
          name: plugin-catalog-snapshot
          path: src/data/catalog.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable discovery snapshot
        uses: actions/upload-artifact@v6
        with:
          name: plugin-discovery-snapshot
          path: validation/discovery.json
          if-no-files-found: error
          retention-days: 30

      - name: Test and build
        run: |
          npm test
          npm run build

      - name: Verify generated catalog preserves upstream archives
        run: |
          node <<'NODE'
          const fs = require('node:fs')

          const read = (path) => JSON.parse(fs.readFileSync(path, 'utf8'))
          const source = read('src/data/catalog.json')
          const built = read('dist/catalog.json')
          const discovery = read('validation/discovery.json')
          const projection = (catalog) => ({
            repositoryIds: catalog.repositories.map(({ repositoryId }) => repositoryId),
            verified: catalog.stats.verified,
            validationStatuses: catalog.stats.validationStatuses,
            classifications: catalog.repositories.map((entry) => ({
              repositoryId: entry.repositoryId,
              projectType: entry.projectType,
              category: entry.category,
              categories: entry.categories,
              classificationSource: entry.classificationSource,
              classificationSignals: entry.classificationSignals,
            })),
          })
          if (JSON.stringify(projection(source)) !== JSON.stringify(projection(built))) {
            throw new Error('Built catalog changed classification or validation state')
          }

          const archivePath = 'src/data/source-classification.json'
          if (fs.existsSync(archivePath)) {
            const archive = read(archivePath)
            if (archive.classifierVersion !== process.env.SOURCE_CLASSIFIER_VERSION) {
              console.log('Source classification archive is stale. Last valid catalog remains published; no new Topic candidate is admitted.')
            } else {
              const sourceById = new Map(source.repositories.map((entry) => [entry.repositoryId, entry]))
              const archiveById = new Map(archive.records.map((record) => [record.repositoryId, record]))
              const expectedVisibleIds = new Set(discovery.repositories
                .filter((repository) => {
                  const record = archiveById.get(repository.id)
                  return record
                    && record.disposition === 'include'
                    && record.sourcePushedAt === repository.pushed_at
                    && record.classification?.dshRelevance === 'recognized'
                })
                .map((repository) => repository.id))
              const actualVisibleIds = new Set(source.repositories.map((entry) => entry.repositoryId))
              if (expectedVisibleIds.size !== actualVisibleIds.size
                || [...expectedVisibleIds].some((repositoryId) => !actualVisibleIds.has(repositoryId))) {
                throw new Error(`Catalog visibility does not match source archive: expected ${expectedVisibleIds.size}, got ${actualVisibleIds.size}`)
              }
              const excludedIds = archive.records
                .filter((record) => record.disposition !== 'include'
                  || record.classification?.dshRelevance !== 'recognized')
                .map((record) => record.repositoryId)
              if (excludedIds.some((repositoryId) => sourceById.has(repositoryId))) {
                throw new Error('Catalog contains a repository excluded by source classification')
              }
              const expectedVerified = new Set(archive.records
                .filter((record) => record.disposition === 'include'
                  && record.validation?.status === 'passed'
                  && record.validation?.sourceSha === record.sourceSha)
                .filter((record) => sourceById.get(record.repositoryId)?.pushedAt === record.sourcePushedAt)
                .map((record) => record.repositoryId))
              const actualVerified = new Set(source.repositories
                .filter((entry) => entry.validation.overall === 'verified')
                .map((entry) => entry.repositoryId))
              if (expectedVerified.size !== actualVerified.size
                || [...expectedVerified].some((repositoryId) => !actualVerified.has(repositoryId))) {
                throw new Error(`Catalog validation conclusions do not match source archive: expected ${expectedVerified.size}, got ${actualVerified.size}`)
              }
              for (const record of archive.records) {
                if (record.disposition !== 'include'
                  || record.classification?.dshRelevance !== 'recognized'
                  || record.classification.typeConfidence === 'low') continue
                const entry = sourceById.get(record.repositoryId)
                // The archive intentionally retains historical records. A
                // repository that is no longer in the current Topic discovery
                // must not make the current catalog refresh fail.
                if (!entry) continue
                if (entry.pushedAt !== record.sourcePushedAt) {
                  if (record.validation && entry.validation.overall !== 'expired') {
                    throw new Error(`Changed repository ${record.repositoryId} did not expire archived validation`)
                  }
                  continue
                }
                if (entry.classificationSource !== 'source') {
                  throw new Error(`Catalog is missing source classification for repository ${record.repositoryId}`)
                }
                if (record.classification.projectType !== 'unknown' && entry.projectType !== record.classification.projectType) {
                  throw new Error(`Catalog project type disagrees with source archive for repository ${record.repositoryId}`)
                }
                if (record.classification.category !== 'other' && entry.category !== record.classification.category) {
                  throw new Error(`Catalog category disagrees with source archive for repository ${record.repositoryId}`)
                }
              }
            }
          } else {
            console.log('No source classification archive was restored. Last valid catalog remains published; no new Topic candidate is admitted.')
          }
          console.log(`Catalog archive check passed: ${source.stats.verified} verified, ${source.repositories.length} included repositories`)
          NODE

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DSH_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DSH_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/dsh-store-deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/dsh-store-deploy ~/.ssh/known_hosts

      - name: Publish to dshmk.com
        env:
          DEPLOY_HOST: ${{ secrets.DSH_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DSH_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DSH_DEPLOY_USER }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          deploy_sha="$(printf '%s' "$SOURCE_COMMIT:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-40)"
          tar -C dist -czf - . | ssh \
            -i ~/.ssh/dsh-store-deploy \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $deploy_sha"
