name: Validate plugins

on:
  workflow_run:
    workflows: [Classify plugins]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_full:
        description: Revalidate every repository in the classified validation catalog
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: plugin-validation-publication
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLASSIFICATION_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      CLASSIFICATION_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Stop after a failed classification run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Classification workflow did not succeed: ${{ github.event.workflow_run.conclusion }}"
          exit 1

      - name: Checkout validation source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve latest catalog, discovery, validation, and classification artifacts
        run: |
          mkdir -p validation-input/previous
          mkdir -p /tmp/dsh-validation-history
          if test -f src/data/source-classification.json; then
            cp src/data/source-classification.json /tmp/dsh-validation-history/checked-in.json
          fi
          catalog_found=false
          discovery_found=false
          sync_run_ids="$(gh run list --workflow sync-catalog.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          for run_id in $sync_run_ids; do
            catalog_dir="/tmp/dsh-catalog-$run_id"
            if test "$catalog_found" = false \
              && gh run download "$run_id" --name plugin-catalog-snapshot --dir "$catalog_dir" 2>/dev/null \
              && test -f "$catalog_dir/catalog.json"; then
              cp "$catalog_dir/catalog.json" validation-input/catalog.json
              catalog_found=true
            fi
            discovery_dir="/tmp/dsh-discovery-$run_id"
            if test "$discovery_found" = false \
              && gh run download "$run_id" --name plugin-discovery-snapshot --dir "$discovery_dir" 2>/dev/null \
              && test -f "$discovery_dir/discovery.json"; then
              cp "$discovery_dir/discovery.json" validation-input/discovery.json
              discovery_found=true
            fi
            if test "$catalog_found" = true && test "$discovery_found" = true; then break; fi
          done
          if test "$catalog_found" = false; then cp src/data/catalog.json validation-input/catalog.json; fi
          if test "$discovery_found" = false; then cp validation-input/catalog.json validation-input/discovery.json; fi

          state_found=false
          validation_run_ids="$(gh run list --workflow validate-plugins.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          for run_id in $validation_run_ids; do
            artifact_dir="/tmp/dsh-validation-state-$run_id"
            if gh run download "$run_id" --name plugin-validation-state --dir "$artifact_dir" 2>/dev/null \
              && test -f "$artifact_dir/state.json" \
              && test -f "$artifact_dir/validation.json" \
              && test -f "$artifact_dir/source-classification.json" \
              && find "$artifact_dir/canary" -type f -name '*.json' -print -quit | grep -q .; then
              cp "$artifact_dir/source-classification.json" "/tmp/dsh-validation-history/$run_id.json"
              if test "$state_found" = false; then
                cp -R "$artifact_dir/." validation-input/previous/
                state_found=true
              fi
            fi
          done
          if test "$state_found" = true; then
            cp validation-input/previous/validation.json validation-input/previous-validation.json
          else
            cp src/data/validation.json validation-input/previous-validation.json
          fi

          classification_found=false
          classification_discovery_found=false
          if test -n "$CLASSIFICATION_RUN_ID"; then
            completed_run_ids="$CLASSIFICATION_RUN_ID"
          else
            completed_run_ids="$(gh run list --workflow classify-plugins.yml --branch "$CLASSIFICATION_BRANCH" --limit 30 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)"
          fi
          for run_id in $completed_run_ids; do
            run_metadata="$(gh run view "$run_id" --json workflowName,headBranch,status,conclusion 2>/dev/null || true)"
            if [[ -z "$run_metadata" ]] || ! printf '%s' "$run_metadata" | EXPECTED_BRANCH="$CLASSIFICATION_BRANCH" node -e '
              const fs = require("node:fs")
              const metadata = JSON.parse(fs.readFileSync(0, "utf8"))
              process.exit(metadata.workflowName === "Classify plugins"
                && metadata.headBranch === process.env.EXPECTED_BRANCH
                && metadata.status === "completed"
                && ["success", "failure", "cancelled", "timed_out"].includes(metadata.conclusion) ? 0 : 1)
            '; then
              continue
            fi
            artifact_dir="/tmp/dsh-classification-state-$run_id"
            if gh run download "$run_id" --name plugin-classification-state --dir "$artifact_dir" 2>/dev/null \
              && test -f "$artifact_dir/source-classification.json" \
              && test -f "$artifact_dir/validation-catalog.json" \
              && test -f "$artifact_dir/discovery.json"; then
              cp "$artifact_dir/source-classification.json" validation-input/source-classification.json
              cp "$artifact_dir/validation-catalog.json" validation-input/validation-catalog.json
              cp "$artifact_dir/discovery.json" validation-input/discovery.json
              classification_discovery_found=true
              classification_found=true
              break
            fi
          done
          if test "$classification_found" = false; then
            echo 'No completed classified validation catalog is available; validation is deferred.' >&2
            exit 1
          fi
          if test "$classification_discovery_found" != true; then
            echo 'Classified validation catalog has no paired discovery snapshot; validation is deferred.' >&2
            exit 1
          fi

      - name: Verify atomic validation input snapshots
        run: |
          npm run --silent validate:input -- \
            --discovery validation-input/discovery.json \
            --validation-catalog validation-input/validation-catalog.json \
            --classification validation-input/source-classification.json \
            --validation-history-directory /tmp/dsh-validation-history

      - name: Upload immutable validation input
        uses: actions/upload-artifact@v6
        with:
          name: plugin-validation-input
          path: validation-input/
          if-no-files-found: error
          retention-days: 30

  select:
    needs: prepare
    outputs:
      has_changes: ${{ steps.selection.outputs.has_changes }}
      first_run: ${{ steps.selection.outputs.first_run }}
      shards: ${{ steps.selection.outputs.shards }}
    env:
      FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full || false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v5

      - name: Download validation input
        uses: actions/download-artifact@v7
        with:
          name: plugin-validation-input
          path: validation-input

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select full or incremental validation set from classified catalog
        id: selection
        run: |
          previous_args=()
          if test "$FORCE_FULL" != "true" && test -f validation-input/previous/state.json; then
            previous_args=(--previous validation-input/previous/state.json)
          fi
          npm run --silent validate:select -- \
            --catalog validation-input/validation-catalog.json \
            --baseline validation/baseline.json \
            --previous-feed validation-input/previous-validation.json \
            --output validation-input/selection.json \
            --shard-count 20 \
            "${previous_args[@]}" > validation-input/selection-summary.json
          npm run --silent validate:input -- \
            --discovery validation-input/discovery.json \
            --validation-catalog validation-input/validation-catalog.json \
            --selection validation-input/selection.json
          node -e 'const fs=require("fs"); const summary=JSON.parse(fs.readFileSync("validation-input/selection-summary.json","utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT,"has_changes="+String(summary.repositoryCount>0)+"\nfirst_run="+String(summary.firstRun)+"\nshards="+JSON.stringify(summary.shards)+"\n")'

      - name: Upload classified validation selection
        uses: actions/upload-artifact@v6
        with:
          name: plugin-validation-selection
          path: validation-input/selection.json
          if-no-files-found: error
          retention-days: 30

  baseline:
    needs: select
    if: needs.select.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v5

      - name: Download validation input and selection
        uses: actions/download-artifact@v7
        with:
          pattern: plugin-validation-*
          path: validation-input
          merge-multiple: true

      - name: Restore catalog snapshot
        run: cp validation-input/catalog.json src/data/catalog.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run initial 20-target canary serially
        if: needs.select.outputs.first_run == 'true'
        run: >-
          npm run validate:baseline --
          --output validation/reports/canary
          --limit 0

      - name: Reuse compatible canary evidence
        if: needs.select.outputs.first_run != 'true'
        run: |
          mkdir -p validation/reports/canary
          cp -R validation-input/previous/canary/. validation/reports/canary/

      - name: Enforce canary promotion gate
        run: |
          npm run --silent validate:promote -- \
            --reports validation/reports/canary > /tmp/canary-gate.json
          node -e "const result=require('/tmp/canary-gate.json'); if(!result.assessment.eligible){console.error(result.assessment.reasons.join(',')); process.exit(1)}"

      - name: Upload current canary reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plugin-validation-canary-current
          path: validation/reports/canary/
          if-no-files-found: error
          retention-days: 30

  validate:
    # Baseline is validator-health telemetry. It must not prevent per-plugin
    # evidence from being collected and archived.
    needs: [select]
    if: needs.select.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DSH_VALIDATION_VERSION: 0.1.0-rc.6
      VALIDATOR_VERSION: 0.1.2
      VALIDATION_STRUCTURE_CONCURRENCY: 2
      VALIDATION_CANDIDATE_CONCURRENCY: 2
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v5

      - name: Download validation input and selection
        uses: actions/download-artifact@v7
        with:
          pattern: plugin-validation-*
          path: validation-input
          merge-multiple: true

      - name: Restore catalog snapshot
        run: cp validation-input/catalog.json src/data/catalog.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run selected P1 structure shard with bounded concurrency
        run: |
          npm run --silent validate:shadow -- \
            --output validation/reports/structure \
            --discovery validation-input/discovery.json \
            --selection validation-input/selection.json \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 20 \
            --limit 0 | tee /tmp/shadow-summary.json
          node -e "const result=require('/tmp/shadow-summary.json'); if(result.reportsWritten > result.discovered){console.error('P1 reports exceed discovery count'); process.exit(1)}; if(result.loadFailures.length || result.reportsWritten !== result.discovered){console.warn('P1 shard completed with retryable snapshot omissions', JSON.stringify({discovered:result.discovered,reportsWritten:result.reportsWritten,loadFailures:result.loadFailures.map(({repositoryId,code})=>({repositoryId,code}))}))}"

      - name: Run selected sandbox candidates with bounded concurrency
        run: >-
          npm run validate:candidates --
          --reports validation/reports/structure
          --output validation/reports/candidates

      - name: Upload sanitized structure and runtime reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plugin-validation-candidates-${{ matrix.shard }}
          path: validation/reports/
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: [select, baseline, validate]
    if: needs.select.outputs.has_changes == 'true' && needs.baseline.result == 'success' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v5

      - name: Download validation input and artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: plugin-validation-*
          path: validation-artifacts
          merge-multiple: true

      - name: Download current canary reports
        uses: actions/download-artifact@v7
        with:
          name: plugin-validation-canary-current
          path: validation-artifacts/canary

      - name: Download candidate reports
        uses: actions/download-artifact@v7
        with:
          pattern: plugin-validation-candidates-*
          path: validation-artifacts/candidates
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Promote incremental SHA-bound evidence
        run: >-
          npm run validate:promote --
          --reports validation-artifacts/candidates
          --gate-reports validation-artifacts/canary
          --previous-feed validation-artifacts/previous-validation.json
          --output validation-state/validation.json
          --publish

      - name: Advance validation cursor after completed evidence
        run: >-
          npm run validate:state --
          --catalog validation-artifacts/validation-catalog.json
          --previous validation-artifacts/previous/state.json
          --selection validation-artifacts/selection.json
          --reports validation-artifacts/candidates
          --output validation-state/state.json

      - name: Retain reusable canary evidence
        run: |
          mkdir -p validation-state/canary
          cp -R validation-artifacts/canary/. validation-state/canary/

      - name: Upload successful validation state
        uses: actions/upload-artifact@v6
        with:
          name: plugin-validation-publication
          path: validation-state/
          if-no-files-found: error
          retention-days: 30

  validation-archive:
    needs: [select, validate, promote]
    if: always() && needs.select.result == 'success' && needs.select.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v5

      - name: Download immutable validation input and selection
        uses: actions/download-artifact@v7
        with:
          name: plugin-validation-input
          path: validation-input

      - name: Download classified validation selection
        uses: actions/download-artifact@v7
        with:
          name: plugin-validation-selection
          path: validation-input

      - name: Download completed candidate reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: plugin-validation-candidates-*
          path: validation-reports/candidates
          merge-multiple: true

      - name: Download published feed and cursor when promotion succeeded
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: plugin-validation-publication
          path: validation-publication

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Merge observed validation outcomes into the central archive
        continue-on-error: true
        run: >-
          npm run validate:archive --
          --classification validation-input/source-classification.json
          --discovery validation-input/discovery.json
          --selection validation-input/selection.json
          --reports validation-reports/candidates
          --output validation-state/source-classification.json
          --validation-catalog validation-state/validation-catalog.json
          --summary validation-state/validation-summary.json

      - name: Retain a retryable base archive if validation aggregation failed
        run: |
          mkdir -p validation-state
          if test ! -f validation-state/source-classification.json; then cp validation-input/source-classification.json validation-state/source-classification.json; fi
          if test ! -f validation-state/validation-catalog.json && test -f validation-input/validation-catalog.json; then cp validation-input/validation-catalog.json validation-state/validation-catalog.json; fi

      - name: Advance cursor from every observed terminal report
        continue-on-error: true
        run: >-
          npm run validate:state --
          --catalog validation-state/validation-catalog.json
          --previous validation-input/previous/state.json
          --selection validation-input/selection.json
          --reports validation-reports/candidates
          --output validation-state/state.json

      - name: Preserve previous feed and canary when promotion did not publish
        run: |
          if test -f validation-publication/validation.json; then cp validation-publication/validation.json validation-state/validation.json; else cp validation-input/previous-validation.json validation-state/validation.json; fi
          mkdir -p validation-state/canary
          if find validation-publication/canary -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then cp -R validation-publication/canary/. validation-state/canary/; else cp -R validation-input/previous/canary/. validation-state/canary/ 2>/dev/null || true; fi

      - name: Upload central validation state even when candidate shards fail
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plugin-validation-state
          path: validation-state/
          if-no-files-found: error
          retention-days: 30

  checkpoint:
    needs: select
    if: needs.select.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Download validation input
        uses: actions/download-artifact@v7
        with:
          name: plugin-validation-input
          path: validation-input

      - name: Refresh unchanged validation state artifact
        run: |
          mkdir -p validation-state/canary
          cp validation-input/previous/state.json validation-state/state.json
          cp validation-input/previous-validation.json validation-state/validation.json
          cp -R validation-input/previous/canary/. validation-state/canary/
          cp validation-input/source-classification.json validation-state/source-classification.json

      - name: Upload unchanged validation state
        uses: actions/upload-artifact@v6
        with:
          name: plugin-validation-state
          path: validation-state/
          if-no-files-found: error
          retention-days: 30
